version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: gitaparser_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gitaparser
      MYSQL_USER: gitaparser
      MYSQL_PASSWORD: gitaparser123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mariadb_data:
